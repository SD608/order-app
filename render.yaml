services:
  - type: web
    name: cozy-order-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cozy-order-db
          property: connectionString
      - key: CLIENT_ORIGIN
        sync: false

  - type: web
    name: cozy-order-ui
    runtime: static
    rootDir: ui
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: cozy-order-db
    plan: free
